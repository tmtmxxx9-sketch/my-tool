# Render Blueprint（my-tool モノレポ — todo-sheets のみデプロイ）
services:
  - type: web
    name: todo-sheets
    runtime: python
    rootDir: todo-sheets
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: FLASK_SECRET_KEY
        generateValue: true
